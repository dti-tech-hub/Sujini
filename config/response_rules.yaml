# Response policy. All actions are simulated/sandbox-safe by design.
# "advisory" actions are recommendations that the analyst may approve later;
# they are not automatically executed and do not force an approval gate.
simulation_mode: true
allowlist:
  - CREATE_INCIDENT
  - NOTIFY_ANALYST
  - SIMULATE_NOTIFY_ADMIN
  - SIMULATE_BLOCK_IP
  - SIMULATE_DISABLE_SESSION
  - SIMULATE_RESET_CREDENTIAL
  - SIMULATE_QUARANTINE

levels:
  LOW:
    auto: [NOTIFY_ANALYST]
    approval: []
    advisory: []
  MEDIUM:
    auto: [NOTIFY_ANALYST, SIMULATE_NOTIFY_ADMIN]
    approval: []
    advisory: [SIMULATE_BLOCK_IP]
  HIGH:
    auto: [NOTIFY_ANALYST, SIMULATE_NOTIFY_ADMIN]
    approval: [SIMULATE_BLOCK_IP, SIMULATE_DISABLE_SESSION]
    advisory: []
  CRITICAL:
    auto: [NOTIFY_ANALYST, SIMULATE_NOTIFY_ADMIN]
    approval:
      - SIMULATE_BLOCK_IP
      - SIMULATE_DISABLE_SESSION
      - SIMULATE_RESET_CREDENTIAL
      - SIMULATE_QUARANTINE
    advisory: []

# Additional actions implied by the attack category. At LOW/MEDIUM they are
# advisory only; at HIGH/CRITICAL they become approval-gated.
category_additions:
  brute_force: [SIMULATE_BLOCK_IP]
  account_compromise: [SIMULATE_DISABLE_SESSION, SIMULATE_RESET_CREDENTIAL]
  sql_injection: [SIMULATE_BLOCK_IP]
  command_injection: [SIMULATE_QUARANTINE, SIMULATE_BLOCK_IP]
  path_traversal: [SIMULATE_BLOCK_IP]
  malicious_ip: [SIMULATE_BLOCK_IP]
  abnormal_traffic: [SIMULATE_BLOCK_IP]
  recon_scanning: [SIMULATE_BLOCK_IP]
  xss: [SIMULATE_BLOCK_IP]
  prompt_injection_attempt: [NOTIFY_ANALYST]

categories:
  account_compromise:
    description: "Contain the potentially compromised account and terminate active simulated sessions."
  brute_force:
    description: "Throttle and block the attacking source, then verify no successful authentication followed."
  sql_injection:
    description: "Block the source and preserve the request as evidence for web-application review."
  command_injection:
    description: "Quarantine the targeted workload and block the source; inspect server logs out-of-band."
  path_traversal:
    description: "Block the source and verify that no sensitive file was served."
  malicious_ip:
    description: "Block the reputation-listed source and review its full request history."
  abnormal_traffic:
    description: "Rate-limit/block the source if confirmed; distinguish load testing from abuse."
  recon_scanning:
    description: "Block the scanner and review responses for information disclosure."
  prompt_injection_attempt:
    description: "Treat the log text as hostile data, notify the analyst, and preserve the event."

actions:
  CREATE_INCIDENT:
    description: "Create an immutable incident record linked to the triggering events."
    simulated: false
    requires_approval: false
    category: tracking
  NOTIFY_ANALYST:
    description: "Send a notification to the on-call analyst (recorded in the audit log)."
    simulated: true
    requires_approval: false
    category: notification
  SIMULATE_NOTIFY_ADMIN:
    description: "Simulate notifying the system administrator through the configured channel."
    simulated: true
    requires_approval: false
    category: notification
  SIMULATE_BLOCK_IP:
    description: "Simulate adding the source IP to a deny list. No firewall is modified."
    simulated: true
    requires_approval: true
    category: containment
  SIMULATE_DISABLE_SESSION:
    description: "Simulate invalidating the user's active sessions. No real session store is touched."
    simulated: true
    requires_approval: true
    category: containment
  SIMULATE_RESET_CREDENTIAL:
    description: "Simulate forcing a credential reset. No credential is modified."
    simulated: true
    requires_approval: true
    category: remediation
  SIMULATE_QUARANTINE:
    description: "Simulate isolating the targeted workload. No host or container is changed."
    simulated: true
    requires_approval: true
    category: containment

approval:
  allowed_roles: [analyst, admin]
  require_reason_on_reject: true
  min_reason_length: 3
